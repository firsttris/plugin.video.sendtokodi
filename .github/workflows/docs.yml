# Builds docs/ with MkDocs Material and publishes it to GitHub Pages:
# https://firsttris.github.io/plugin.video.sendtokodi/
# One-time prerequisite: Settings → Pages → Source "GitHub Actions"
# (configure-pages with enablement switches that on itself on the first run).
name: Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-revision-date needs the history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      # site/repo/ is a directory listing Kodi can add as an HTTP source, so the
      # repository ZIP installs without copying it to the device first.
      # Kodi only lists links whose text equals the href, next to the page.
      - name: Repository ZIP as Kodi HTTP source
        env:
          REPO_ZIP: repository.sendtokodi-1.0.0.zip
        run: |
          mkdir -p site/repo
          curl -fsSL -o "site/repo/$REPO_ZIP" \
            "https://raw.githubusercontent.com/firsttris/repository.sendtokodi/master/$REPO_ZIP"
          printf '<!DOCTYPE html>\n<html><head><meta charset="utf-8"><title>SendToKodi repository</title></head><body>\n<a href="%s">%s</a> <br>\n</body></html>\n' \
            "$REPO_ZIP" "$REPO_ZIP" > site/repo/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Pull requests only check that the docs build; master publishes them
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
